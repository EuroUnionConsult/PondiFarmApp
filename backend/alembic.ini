# Migrações do PondiFarm (Alembic). Introduzido a 21/10/2026.
# A URL da base vem de core.config (DATABASE_URL / variáveis do Azure), não daqui.
#   alembic upgrade head        aplica as migrações
#   alembic current             mostra em que revisão está a base
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
