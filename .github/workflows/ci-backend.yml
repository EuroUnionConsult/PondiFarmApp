name: ci-backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint and format check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        # Versão FIXADA de propósito. Com "pip install ruff" a CI apanha sempre
        # a mais recente, e uma versão nova do formatador reprova ficheiros que
        # ninguém tocou -- foi o que aconteceu a 21/08/2026, com seis ficheiros
        # idênticos aos da main a passarem lá e a falharem aqui. Um linter sem
        # versão fixada torna a build não determinística: o mesmo commit passa
        # hoje e falha amanhã, sem ninguém ter mudado nada.
        run: pip install ruff==0.16.4

      - name: Ruff check
        run: ruff check .

      - name: Ruff format (verify)
        run: ruff format --check .

  import-smoke:
    name: Import smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI app boots
        run: |
          python -c "from main import app; print(app.title)"
