name: ci-mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: TypeScript type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

  lint:
    name: Expo lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx expo lint

  web-export:
    name: Web build (expo export)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The website (desktop + mobile web) is built from this same app. This catches
      # native-only imports or web files that stop bundling before they reach Coolify.
      - name: Export web bundle
        run: npx expo export --platform web --output-dir dist --clear

      - name: Check lazy chunks and API URL
        run: |
          ls dist/_expo/static/js/web/
          ls dist/_expo/static/js/web/ | grep -q '^ScanViewer-'
          ls dist/_expo/static/js/web/ | grep -q '^FarmMapLeaflet-'
          ! grep -rq "localhost:8000" dist/_expo
