# nginx inside the web container (deploy/web/Dockerfile). The host nginx handles HTTPS and proxies here.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # O mime.types do nginx não tem .ttf: as fontes Inter saíam como
    # application/octet-stream. Um bloco `types` no server substitui os tipos
    # herdados, por isso volta a incluir a lista completa (que já traz
    # font/woff e font/woff2) e acrescenta as que faltam.
    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
        font/otf otf;
    }

    # Os add_header de um location substituem os do server, por isso os
    # cabeçalhos de segurança estão num ficheiro incluído em cada bloco.
    include /etc/nginx/conf.d/security-headers.inc;

    location /_expo/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # Fontes (nomes com hash do conteúdo, como o resto de /assets/): cache longa e imutável.
    location ~* ^/assets/.+\.(ttf|otf|woff2?)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
